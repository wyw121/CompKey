<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CompKey - 热词榜单（Demo）</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px }
    table { border-collapse: collapse; width: 100%; margin-top: 12px }
    th, td { border: 1px solid #ddd; padding: 8px }
    th { background: #f4f4f4 }
    .muted { color: #666; font-size: 12px }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
</head>
<body>
  <h2>热词榜单（Demo）</h2>
  <div class="muted" style="margin-bottom:12px;line-height:1.6">
    <div>数据来源：<span id="dataSource">等待加载...</span></div>
    <div>时间范围：<span id="dataRange">等待加载...</span></div>
    <div>最后刷新时间：<span id="updatedAt">等待加载...</span></div>
  </div>
  <div style="margin-bottom:10px">
    <a href="index.html">关键词推荐</a>
    |
    <a href="trending.html">时下流行关键词</a>
    |
    <label style="margin-left:8px">Demo 源：
      <select id="demoSource">
        <option value="edgar">EDGAR demo</option>
        <option value="aol">AOL demo</option>
      </select>
    </label>
  </div>

  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <label>时间窗口（天）：
      <select id="windowDays">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="7" selected>7</option>
      </select>
    </label>
    <label>展示数量：
      <select id="limit">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
      </select>
    </label>
    <button id="refreshBtn">刷新榜单</button>
  </div>

  <div id="errorBox" style="display:none;margin-top:10px;padding:8px;border:1px solid #f1b5b5;background:#fff5f5;color:#9b1c1c"></div>

  <div id="hotList"></div>

  <div id="trendPanel" style="display:none;margin-top:16px;">
    <h3 id="trendTitle"></h3>
    <div id="trendChart" style="height:320px"></div>
  </div>

  <script src="trending.js?v=2"></script>
</body>
</html>
